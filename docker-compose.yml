version: '3.8'

services:
  # PostgreSQL データベース
  postgres:
    image: postgres:15-alpine
    container_name: devin-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-devin_ai_clone}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - devin-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-devin_ai_clone}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Redis（セッション・キャッシュ用）
  redis:
    image: redis:7-alpine
    container_name: devin-redis
    command: sh -c "redis-server --requirepass \"$$(cat /run/secrets/redis_password)\" --appendonly yes"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - devin-ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "$$(cat /run/secrets/redis_password)", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # バックエンド API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devin-backend
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-devin_ai_clone}
      DB_USER: ${DB_USER:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8765}
    secrets:
      - jwt_secret_key
      - db_password
      - redis_password
      - encryption_key
    volumes:
      - ./models:/models:ro
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devin-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    # セキュリティ設定
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/temp
    user: "1000:1000"

  # フロントエンド
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devin-frontend
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - devin-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    # セキュリティ設定
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  # Nginx リバースプロキシ
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: devin-nginx
    ports:
      - "8765:80"      # メインアクセスポート（8080から変更）
      - "8766:443"     # HTTPS用（8443から変更）
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - devin-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    # セキュリティ設定
    security_opt:
      - no-new-privileges:true

  # ChromaDB（ベクトルデータベース）
  chromadb:
    build:
      context: ./chromadb
      dockerfile: Dockerfile
    container_name: devin-chromadb
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
    volumes:
      - chromadb_data:/chroma/chroma
    ports:
      - "8767:8000"    # ChromaDB管理用ポート（8001から変更）
    networks:
      - devin-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/version"]
      interval: 60s
      timeout: 30s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    # セキュリティ設定
    security_opt:
      - no-new-privileges:true

  # Prometheus 監視（オプション）
  prometheus:
    image: prom/prometheus:latest
    container_name: devin-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "8768:9090"    # Prometheus管理用ポート（9090から変更）
    networks:
      - devin-ai-network
    restart: unless-stopped
    profiles:
      - monitoring

# Docker Secrets（本番環境用）
secrets:
  jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt
  db_password:
    file: ./secrets/db_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  encryption_key:
    file: ./secrets/encryption_key.txt

# 永続化ボリューム
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chromadb_data:
    driver: local
  prometheus_data:
    driver: local
  backend_logs:
    driver: local
  nginx_logs:
    driver: local
  frontend_dist:
    driver: local

# ネットワーク（競合を避けるため名前とサブネットを変更）
networks:
  devin-ai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16  # 172.20.0.0から変更して競合を回避

