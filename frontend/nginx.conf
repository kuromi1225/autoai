server {
    listen 80;
    server_name localhost;

    # Reactアプリの静的ファイルを提供します
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # この設定により、React RouterなどのクライアントサイドのURLが機能します。
        # 存在しないURLへのリクエストは、index.htmlにフォールバックされます。
        try_files $uri /index.html;
    }

    # Dockerのヘルスチェック用エンドポイント
    # この設定がないと、frontendコンテナがunhealthyになり、正常に動作しない可能性があります。
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Gzip圧縮を有効にしてパフォーマンスを向上させます
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # エラーページの設定
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
